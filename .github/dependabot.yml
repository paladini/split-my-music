version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      pip-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # Python minor upgrades (e.g. 3.12 -> 3.15) are done by hand: onnxruntime/audio-separator wheels
      # lag behind new CPython releases, and the GPU image, CI and docs must move together.
      # Patch releases of the pinned minor are picked up automatically when the image is rebuilt.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
